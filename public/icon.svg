<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1a0f3d"/>
      <stop offset="55%" stop-color="#0d0a17"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a76bff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <radialGradient id="dotCore" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c9a9ff"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="70"  fill="none" stroke="rgba(255,255,255,.20)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="2.5"/>

  <!-- Glow behind orbiting dot -->
  <circle cx="357" cy="155" r="34" fill="#7b2fff" opacity=".28"/>
  <circle cx="357" cy="155" r="34" fill="#00b4d8" opacity=".14"/>

  <!-- Orbiting dot -->
  <circle cx="357" cy="155" r="15" fill="url(#dotGrad)"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="30" fill="#7b2fff" opacity=".22"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="url(#dotCore)"/>
</svg>
